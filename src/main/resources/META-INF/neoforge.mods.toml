modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/papiricoh/create_nuclearindustry/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
displayURL="https://github.com/papiricoh/create_nuclearindustry"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Only applies with Sable installed (SableMixinPlugin).
[[mixins]]
config="${mod_id}.sable.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="[6.0.10,6.1.0)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="createbigcannons"
type="optional"
versionRange="[5.11.3,6.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="sable"
type="optional"
versionRange="[2.0.0,3.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aeronautics"
type="optional"
versionRange="[1.3.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="distanthorizons"
type="optional"
versionRange="*"
ordering="NONE"
side="CLIENT"
